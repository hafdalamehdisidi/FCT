<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Cursos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="contenedor">

    <div class="cabecera">
        <h2>Gestión de Cursos</h2>
        <a th:href="@{/inicio}">Volver al inicio</a>
    </div>

    <div th:if="${mensaje}" class="exito" th:text="${mensaje}"></div>
    <div th:if="${error}" class="error" th:text="${error}"></div>

    <a th:href="@{/cursos/nuevo}" class="boton">Nuevo Curso</a>

    <table>
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Nº Alumnos</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.nombre}"></td>
            <!-- Mostramos cuántos alumnos tiene matriculados -->
            <td th:text="${curso.alumnos != null ? curso.alumnos.size() : 0}"></td>
            <td>
                <a th:href="@{/cursos/editar/{id}(id=${curso.id})}" class="boton">Editar</a>
                <a th:href="@{/cursos/eliminar/{id}(id=${curso.id})}"
                   class="boton"
                   onclick="return confirm('¿Estás seguro de eliminar este curso?')">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
