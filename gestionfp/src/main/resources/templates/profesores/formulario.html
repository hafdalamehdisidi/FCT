<!--
    Author: Hafdala Mehdi Sidi
    Formulario para crear y editar profesores.
    Se usan dos formularios separados según si estamos creando o editando.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Profesor</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="contenedor">

    <div class="cabecera">
        <!-- El título cambia según si estamos creando o editando -->
        <h2 th:if="${profesor.id == null}">Nuevo Profesor</h2>
        <h2 th:if="${profesor.id != null}">Editar Profesor</h2>
        <a th:href="@{/profesores}">Volver a la lista</a>
    </div>

    <!-- ===================== -->
    <!-- FORMULARIO CREAR      -->
    <!-- ===================== -->
    <form th:if="${profesor.id == null}"
          th:action="@{/profesores/guardar}"
          th:object="${profesor}"
          method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre"/>
        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" th:field="*{apellidos}" placeholder="Apellidos"/>
        <span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="Email"/>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" th:field="*{password}" placeholder="Contraseña"/>
        <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="directiva">Tipo:</label>
        <select id="directiva" th:field="*{directiva}">
            <option value="false">Profesor</option>
            <option value="true">Directiva</option>
        </select>

        <button type="submit">Guardar</button>

    </form>

    <!-- ===================== -->
    <!-- FORMULARIO EDITAR     -->
    <!-- ===================== -->
    <form th:if="${profesor.id != null}"
          th:action="@{/profesores/actualizar/{id}(id=${profesor.id})}"
          th:object="${profesor}"
          method="post">

        <label for="nombreEditar">Nombre:</label>
        <input type="text" id="nombreEditar" th:field="*{nombre}" placeholder="Nombre"/>
        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="apellidosEditar">Apellidos:</label>
        <input type="text" id="apellidosEditar" th:field="*{apellidos}" placeholder="Apellidos"/>
        <span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

        <label for="emailEditar">Email:</label>
        <input type="email" id="emailEditar" th:field="*{email}" placeholder="Email"/>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="passwordEditar">Contraseña:</label>
        <!-- En la edición la contraseña es opcional -->
        <input type="password" id="passwordEditar" th:field="*{password}"
               placeholder="Dejar vacío para no cambiar"/>
        <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="directivaEditar">Tipo:</label>
        <select id="directivaEditar" th:field="*{directiva}">
            <option value="false">Profesor</option>
            <option value="true">Directiva</option>
        </select>

        <button type="submit">Guardar cambios</button>

    </form>

</div>
</body>
</html>
