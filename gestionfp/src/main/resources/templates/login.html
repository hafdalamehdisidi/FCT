<!--
    Author: Hafdala Mehdi Sidi
    Página de login. Formulario para que el profesor introduzca
    su email y contraseña para acceder a la aplicación.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión FP - Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div class="contenedor-login">
    <h2>Gestión Formación en Empresa</h2>
    <h3>Iniciar Sesión</h3>

    <!-- Mensaje de error si el login falla -->
    <div th:if="${param.error}" class="error">
        Email o contraseña incorrectos.
    </div>

    <!-- Mensaje de confirmación si se ha cerrado sesión -->
    <div th:if="${param.logout}" class="exito">
        Sesión cerrada correctamente.
    </div>

    <!-- Formulario de login. Spring Security recoge los datos en /login -->
    <form th:action="@{/login}" method="post">

        <label for="email">Email:</label>
        <input type="email" id="email" name="username" placeholder="Email" required/>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Contraseña" required/>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
