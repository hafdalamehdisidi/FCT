    Formulario para crear y editar alumnos.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Alumno</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="contenedor">

    <div class="cabecera">
        <h2 th:if="${alumno.id == null}">Nuevo Alumno</h2>
        <h2 th:if="${alumno.id != null}">Editar Alumno</h2>
        <a th:href="@{/alumnos}">Volver a la lista</a>
    </div>

    <!-- Formulario CREAR -->
    <form th:if="${alumno.id == null}"
          th:action="@{/alumnos/guardar}"
          th:object="${alumno}"
          method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre"/>
        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" th:field="*{apellidos}" placeholder="Apellidos"/>
        <span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="Email"/>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="fechaNacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}"/>
        <span class="error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>

        <label for="curso">Curso:</label>
        <select id="curso" th:field="*{curso}">
            <option value="">-- Selecciona un curso --</option>
            <option th:each="curso : ${cursos}"
                    th:value="${curso.id}"
                    th:text="${curso.nombre}">
            </option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('curso')}" th:errors="*{curso}"></span>

        <button type="submit">Guardar</button>
    </form>

    <!-- Formulario EDITAR -->
    <form th:if="${alumno.id != null}"
          th:action="@{/alumnos/actualizar/{id}(id=${alumno.id})}"
          th:object="${alumno}"
          method="post">

        <label for="nombreEditar">Nombre:</label>
        <input type="text" id="nombreEditar" th:field="*{nombre}" placeholder="Nombre"/>
        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="apellidosEditar">Apellidos:</label>
        <input type="text" id="apellidosEditar" th:field="*{apellidos}" placeholder="Apellidos"/>
        <span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

        <label for="emailEditar">Email:</label>
        <input type="email" id="emailEditar" th:field="*{email}" placeholder="Email"/>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="fechaNacimientoEditar">Fecha de nacimiento:</label>
        <input type="date" id="fechaNacimientoEditar" th:field="*{fechaNacimiento}"/>
        <span class="error" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>

        <label for="cursoEditar">Curso:</label>
        <select id="cursoEditar" th:field="*{curso}">
            <option value="">-- Selecciona un curso --</option>
            <option th:each="curso : ${cursos}"
                    th:value="${curso.id}"
                    th:text="${curso.nombre}">
            </option>
        </select>

        <button type="submit">Guardar cambios</button>
    </form>

</div>
</body>
</html>
